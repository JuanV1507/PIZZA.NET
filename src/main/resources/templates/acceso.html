<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | PIZZA.NET</title>
    <link rel="stylesheet" th:href="@{/css/styleLogin.css}">
    <style>
        /* Estilos adicionales para alertas glassmórficas */
        .message {
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.4s ease;
        }
        
        .success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }
        
        .error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Recuperar Contraseña</h1>
            <p class="subtitle">Ingresa tu correo electrónico registrado para recibir un enlace seguro de recuperación.</p>
            
            <form id="recoveryForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@correo.com">
                </div>
                
                <button type="submit" class="btn">Enviar Enlace</button>
            </form>
            
            <div class="message" id="message"></div>
            
            <p class="note">¿Te acordaste? <a th:href="@{/login}">Iniciar Sesión</a></p>
        </div>
    </div>
    
    <script>
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            // Estado de carga
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            messageDiv.style.display = 'none';
            
            fetch('/api/recuperar-contrasena', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => {
                return response.json().then(data => {
                    if (!response.ok) {
                        throw new Error(data.mensaje || 'Error al procesar la solicitud.');
                    }
                    return data;
                });
            })
            .then(data => {
                messageDiv.className = 'message success';
                messageDiv.textContent = data.mensaje;
                messageDiv.style.display = 'block';
                document.getElementById('recoveryForm').reset();
            })
            .catch(error => {
                messageDiv.className = 'message error';
                messageDiv.textContent = error.message;
                messageDiv.style.display = 'block';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Enlace';
            });
        });
    </script>
</body>
</html>
