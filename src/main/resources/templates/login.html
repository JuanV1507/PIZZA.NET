<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/styleLogin.css}">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h1>Iniciar Sesión</h1>
      <!-- Formulario que envía datos a Spring Boot -->
      <form th:action="@{/login}" method="post">
    <div class="input-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="Usuario" required>
    </div>
    <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Entrar</button>
    <p th:if="${error}" th:text="${error}" style="color: #e74c3c; text-align: center; font-weight: bold; margin-top: 10px;"></p>
    <p th:if="${success}" th:text="${success}" style="color: #2ecc71; text-align: center; font-weight: bold; margin-top: 10px;"></p>
</form>


      <p class="note">¿No recuerdas tu contraseña? <a th:href="@{/acceso}">Recupérala</a></p>
    </div>
  </div>
</body>
</html>
